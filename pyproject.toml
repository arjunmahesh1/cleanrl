[project]
name = "ppo-robustness"
version = "0.1.0"
description = "PPO value-target clipping as a tractable instantiation of TV-ball distributionally robust MDPs"
authors = [{ name = "Arjun Mahesh", email = "arjun.mahesh@duke.edu" }]
requires-python = ">=3.8,<3.11"
readme = "README.md"
license = "MIT"
keywords = [
    "reinforcement learning",
    "robust reinforcement learning",
    "distributionally robust MDP",
    "MuJoCo",
]
dependencies = [
    "tensorboard>=2.10.0",
    "wandb>=0.13.11",
    "gymnasium==0.29.1",
    "torch==2.4.1",
    "moviepy>=1.0.3",
    "huggingface-hub>=0.11.1",
    "tyro>=0.5.10",
    "numpy",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
mujoco = [
    "mujoco<=2.3.3",
    "imageio>=2.14.1,<3",
]
pytest = ["pytest>=7.1.3,<8"]

[tool.hatch.build.targets.sdist]
include = [
    "cleanrl",
    "cleanrl_utils",
]

[tool.hatch.build.targets.wheel]
include = [
    "cleanrl",
    "cleanrl_utils",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
